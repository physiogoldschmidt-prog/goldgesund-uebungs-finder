<head>

<title>Übungs-Finder | GOLDGESUND</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5EDD8;
  --accent:#C8963E;
  --btn:#1D9E75;
  --btn-dark:#156b50;
  --input-bg:rgba(44,35,10,0.08);
  --input-border:rgba(200,150,62,0.35);
  --card-bg:rgba(255,255,255,0.65);
  --card-border:rgba(200,150,62,0.25);
  --text:#2C2C2A;
  --muted:#6b5c3a;
}
html,body{min-height:100vh;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;padding:48px 20px 60px}

.header{text-align:center;margin-bottom:40px}
.wordmark{font-family:'Allura',cursive;font-size:48px;color:var(--accent);display:block;margin-bottom:2px}
.by-line{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:20px}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,38px);font-weight:700;line-height:1.2;margin-bottom:10px;color:var(--btn)}
.header p{font-size:15px;font-weight:400;color:var(--muted);max-width:480px;line-height:1.75}

.footer{text-align:center;margin-top:48px;padding-top:24px;border-top:1px solid rgba(200,150,62,0.2);width:100%;max-width:560px}
.footer p{font-size:14px;color:var(--muted);line-height:1.8}
.footer a{color:var(--accent);text-decoration:none;font-weight:500}
.footer a:hover{text-decoration:underline}
.no-match{background:rgba(255,255,255,0.7);border:1px solid rgba(200,150,62,0.3);border-radius:14px;padding:24px;text-align:center;font-size:15px;color:var(--muted);line-height:1.7}

.form-card{background:rgba(255,255,255,0.55);backdrop-filter:blur(12px);border:1px solid rgba(200,150,62,0.2);border-radius:20px;padding:36px 32px;width:100%;max-width:560px;margin-bottom:32px;box-shadow:0 4px 32px rgba(100,70,10,0.08)}

.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.form-group input{width:100%;background:rgba(255,255,255,0.8);border:1.5px solid var(--input-border);border-radius:10px;padding:13px 16px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .18s,background .18s}
.form-group input::placeholder{color:var(--muted);opacity:.6}
.form-group input:focus{border-color:var(--accent);background:#fff}

.btn-primary{width:100%;padding:15px;background:var(--btn);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .18s,transform .1s;margin-top:4px;letter-spacing:.3px}
.btn-primary:hover:not(:disabled){background:var(--btn-dark);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}

.error{background:#fff0e0;border:1px solid rgba(200,150,62,0.4);color:#7a4a00;border-radius:10px;padding:14px 18px;font-size:14px;line-height:1.6;margin-bottom:16px;display:none}
.error.show{display:block}

.results{width:100%;max-width:560px;display:none}
.results.show{display:block}

.back-btn{background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:8px;padding:9px 18px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;margin-bottom:22px;transition:background .18s,color .18s}
.back-btn:hover{background:var(--accent);color:#fff}

.results-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;text-align:center;margin-bottom:5px;color:var(--text)}
.results-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:26px}

.cards{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(10px);border-radius:16px;padding:24px 26px;box-shadow:0 2px 20px rgba(100,70,10,0.07)}
.card-num{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.card-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;margin-bottom:8px;line-height:1.2;color:var(--text)}
.card-desc{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:14px}
.card-hr{height:1px;background:rgba(200,150,62,0.2);margin:12px 0}
.card-anleitung-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card-anleitung{font-size:14px;line-height:1.75;color:var(--text);white-space:pre-wrap}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:8px}
.card-dauer{background:rgba(29,158,117,0.12);border:1px solid rgba(29,158,117,0.3);color:var(--btn-dark);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;letter-spacing:.3px}
.card-tipp{font-size:12px;color:var(--muted);font-style:italic;line-height:1.5;margin-top:10px}
</style>
</head>
<body>

<div class="header">
  <span class="wordmark">goldgesund</span>
  <span class="by-line">Lisa Goldschmidt · Osteopathin</span>
  <h1>Dein persönlicher<br>Übungs-Finder</h1>
  <p>Beschreibe kurz deine Situation — ich schlage dir drei passende Übungen vor.</p>
</div>

<div class="form-card" id="form-card">
  <div class="error" id="error"></div>
  <div class="form-group">
    <label>Dein Vorname (optional)</label>
    <input type="text" id="vorname" placeholder="z.B. Anna" autocomplete="given-name"/>
  </div>
  <div class="form-group">
    <label>Was spürst du? (Symptom)</label>
    <input type="text" id="symptom" placeholder="z.B. Kopfschmerzen, Nackenverspannung, Bauchschmerzen …" autocomplete="off"/>
  </div>
  <div class="form-group">
    <label>Wie ist deine Stimmung?</label>
    <input type="text" id="stimmung" placeholder="z.B. gestresst, erschöpft, ängstlich, traurig …" autocomplete="off"/>
  </div>
  <div class="form-group">
    <label>Wo bist du gerade?</label>
    <input type="text" id="situation" placeholder="z.B. zuhause, Büro, unterwegs, im Auto …" autocomplete="off"/>
  </div>
  <button class="btn-primary" id="btn" onclick="suchen()">Übungen finden →</button>
</div>

<div class="results" id="results">
  <button class="back-btn" onclick="reset()">← Zurück</button>
  <div class="results-title" id="results-title">Deine 3 Übungen</div>
  <div class="results-sub" id="results-sub"></div>
  <div class="cards" id="cards"></div>
</div>

<footer class="footer">
  <p>Dieses Tool ersetzt keine Behandlung.<br>
  Hast du Fragen oder möchtest du einen Termin?<br>
  <a href="mailto:lisa.goldschmidt@stressfrei-er-leben.de">Schreib mir →</a>
  </p>
</footer>

function mapInput(text, map) {
  const lower = text.toLowerCase();
  for (const [key, val] of Object.entries(map)) {
    if (lower.includes(key)) return val;
  }
  return lower;
}

function findeUebungen(symptomRaw, stimmungRaw, situationRaw) {
  const symptom = mapInput(symptomRaw, SYMPTOM_MAP);
  const stimmung = mapInput(stimmungRaw, STIMMUNG_MAP);
  const situation = mapInput(situationRaw, SITUATION_MAP);

  const scored = uebungen.map(u => {
    let score = 0;
    if (u.symptome.some(s => symptom.includes(s) || s.includes(symptom))) score += 3;
    if (u.stimmung.some(s => stimmung.includes(s) || s.includes(stimmung))) score += 2;
    if (u.situation.some(s => situation.includes(s) || s.includes(situation))) score += 1;
    return { ...u, score };
  });

  const relevant = scored
    .filter(u => u.score > 0)
    .sort((a, b) => b.score - a.score || Math.random() - 0.5);

  // Versuche aus verschiedenen Säulen zu wählen
  const result = [];
  const säulen = new Set();
  for (const u of relevant) {
    if (result.length >= 3) break;
    if (!säulen.has(u.säule) || result.length === 2) {
      result.push(u);
      säulen.add(u.säule);
    }
  }
  // Auffüllen falls nötig
  for (const u of relevant) {
    if (result.length >= 3) break;
    if (!result.find(r => r.id === u.id)) result.push(u);
  }
  // Kein Treffer → null zurückgeben
  if (result.length === 0) return null;
  return result.slice(0, 3);
}

    zeigenErgebnisse(treffer, vorname, symptom, stimmung, situation);
  } catch(e) {
    const err = document.getElementById('error');
    err.textContent = 'Fehler: ' + e.message;
    err.classList.add('show');
  }
}

function zeigenErgebnisse(liste, vorname, symptom, stimmung, situation) {
  const name = vorname ? vorname + ', hier' : 'Hier';
  const parts = [symptom, stimmung, situation].filter(Boolean);

  document.getElementById('results-title').textContent = name + ' sind deine 3 Übungen';
  document.getElementById('results-sub').textContent = parts.length
    ? 'Passend zu: ' + parts.join(' · ')
    : '';

  const cards = document.getElementById('cards');
  cards.innerHTML = '';

  if (!liste) {
    cards.innerHTML = '<div class="no-match">Dazu habe ich leider keine passende Übung gefunden.<br>Versuch es mit anderen Worten — z.B. <em>Nacken</em> statt <em>Hals</em>, oder <em>gestresst</em> statt <em>nervös</em>.<br><br>Oder schreib mir direkt: <a href="mailto:lisa.goldschmidt@stressfrei-er-leben.de" style="color:var(--accent)">lisa.goldschmidt@stressfrei-er-leben.de</a></div>';
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('results').classList.add('show');
    return;
  }

  const säulenLabel = { parietal: '🟢 Parietal', viszeral: '🟡 Viszeral', craniosacral: '🔵 Craniosacral' };

  liste.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-num">Übung ${i + 1} · ${säulenLabel[u.säule] || u.säule}</div>
      <div class="card-title">${esc(u.titel)}</div>
      <div class="card-desc">${esc(u.beschreibung)}</div>
      <div class="card-footer">
        <span class="card-dauer">⏱ ${esc(u.dauer)}</span>
      </div>
      ${u.tipp ? `<div class="card-tipp">💡 ${esc(u.tipp)}</div>` : ''}
    `;
    cards.appendChild(card);
  });

  document.getElementById('form-card').style.display = 'none';
  const res = document.getElementById('results');
  res.classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reset() {
  document.getElementById('results').classList.remove('show');
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('error').classList.remove('show');
  ['symptom','stimmung','situation'].forEach(id => document.getElementById(id).value = '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

['symptom','stimmung','situation'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); suchen(); }
  });
});
</script>
